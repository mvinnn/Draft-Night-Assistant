<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bozo Club Draft Assistant</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface-1: #ffffff;
    --surface-2: #eef0f3;
    --border: #dde1e6;
    --text: #1a1d21;
    --text-secondary: #5b6270;
    --text-muted: #8a919e;
    --radius: 10px;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;

    --accent: #3b6fe0;
    --bg-accent: #e8eefc;
    --text-accent: #3b6fe0;

    --success: #1c8a4b;
    --bg-success: #e5f6ec;
    --text-success: #1c8a4b;

    --warning: #b06a00;
    --bg-warning: #fdf1de;
    --text-warning: #b06a00;

    --danger: #c8372f;
    --bg-danger: #fbe9e8;
    --text-danger: #c8372f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface-1: #1c1f24;
      --surface-2: #24272d;
      --border: #32363d;
      --text: #eceef1;
      --text-secondary: #a6acb8;
      --text-muted: #767c88;

      --accent: #6d93ee;
      --bg-accent: #22304f;
      --text-accent: #8fb0f5;

      --success: #3fbd77;
      --bg-success: #163524;
      --text-success: #5fd394;

      --warning: #e0a53d;
      --bg-warning: #3a2c10;
      --text-warning: #f0bb5e;

      --danger: #e46861;
      --bg-danger: #3a1917;
      --text-danger: #f0847d;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app {
    max-width: 760px;
    margin: 0 auto;
    padding: 1.5rem 1rem 4rem;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 2px; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
  .subtitle { color: var(--text-secondary); font-size: 13px; margin: 0 0 1.5rem; }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    margin-bottom: 1.25rem;
  }
  .card-flat {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    margin-bottom: 1.25rem;
  }
  .label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  input[type=text], input[type=number] {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  button:hover { filter: brightness(1.08); }
  button.secondary {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.danger-ghost {
    background: transparent;
    color: var(--text-danger);
    border: 1px solid var(--border);
  }
  button:disabled { opacity: 0.5; cursor: default; }

  .row { display: flex; gap: 8px; align-items: center; }
  .row.wrap { flex-wrap: wrap; }
  .grow { flex: 1; }

  .stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin-bottom: 1.25rem; }
  .stat { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
  .stat .label { margin-bottom: 4px; }
  .stat .value { font-size: 22px; font-weight: 600; }

  .pill {
    font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
    background: var(--bg-accent); color: var(--text-accent); display: inline-block;
  }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); display: inline-block; }

  .chip {
    font-size: 12.5px; padding: 4px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px;
  }
  .chip.target { background: var(--bg-success); color: var(--text-success); }
  .chip.avoid { background: var(--bg-danger); color: var(--text-danger); }

  .player-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px;
  }
  .player-row .rank { font-size: 12px; color: var(--text-muted); width: 26px; }
  .pos-badge {
    font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px;
    width: 28px; text-align: center; flex-shrink: 0;
  }
  .pos-QB { background: var(--bg-accent); color: var(--text-accent); }
  .pos-RB { background: var(--bg-success); color: var(--text-success); }
  .pos-WR { background: var(--bg-warning); color: var(--text-warning); }
  .pos-TE { background: var(--bg-danger); color: var(--text-danger); }
  .player-name { font-size: 13.5px; flex: 1; }
  .player-row button { font-size: 11.5px; padding: 4px 9px; }
  .flag-icon { font-size: 13px; }

  .muted-note { font-size: 12px; color: var(--text-muted); margin: 8px 0 0; }
  .error-text { font-size: 13px; color: var(--text-danger); margin: 8px 0 0; }
  .status-text { font-size: 13px; color: var(--text-muted); margin: 8px 0 0; }

  .field-inline { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-secondary); }
  .field-inline input { width: 56px; }

  a { color: var(--text-accent); }
  code { font-family: var(--font-mono); background: var(--surface-2); padding: 1px 4px; border-radius: 4px; }

  #best-available-list { display: flex; flex-direction: column; }
</style>
</head>

// FLAGS is keyed by the app's own internal player-name spelling (matches
// RANKINGS, which every candidatePool/available lookup already goes
// through — those raw FLAGS[name] lookups are safe as-is). Sleeper's LIVE
// pick metadata (state.yourRoster, built in fetchPicks) is a different
// name source and can disagree on punctuation/suffixes (the whole reason
// normalizeName() exists and is used for every other Sleeper<->internal
// name comparison in this file). Any FLAGS lookup against a name that
// came from live Sleeper data — not from RANKINGS — must go through this,
// not a raw FLAGS[name], or it can silently miss real matches.
const FLAGS_BY_NORM = {};
Object.keys(FLAGS).forEach(k => { FLAGS_BY_NORM[normalizeName(k)] = FLAGS[k]; });
function getFlag(name) {
  return FLAGS_BY_NORM[normalizeName(name)] || null;
}

const ROUND_PLAN = [
  {r:1, pos:"RB", note:"Take conviction, not “value” — PPG gap 9-12 vs top-8 is only 0.5 since 2019"},
  {r:2, pos:"RB / BPA", note:"Right after your own pick — full read on who's gone"},

  {r:7, pos:"BPA", note:"Steepest talent drop-off remaining"},

  {r:14, pos:"DST", note:""},
  {r:15, pos:"Stash/Handcuff", note:"No kicker in this league — use it as a real roster spot"},
];

// For local testing only — never used as a shipped default (see
// initFromUrlParams). A hardcoded default here would mean every peer who
// opens the shared GitHub Pages link auto-connects to this specific mock
// draft and gets silently assumed to be sitting in slot 12.
const TEST_DRAFT_ID = "1397995205646409728";

// Tier boundaries are within-position (a player's rank among their own
// position), not their overall 1-150 rank.
function assignTiers(rankings) {
  const posRanks = {};
  return rankings.map(([rank, name, pos]) => {
    posRanks[pos] = (posRanks[pos] || 0) + 1;
    const posRank = posRanks[pos];
    let tier;
    if (pos === "RB") tier = posRank <= 9 ? 1 : posRank <= 16 ? 2 : posRank <= 25 ? 3 : posRank <= 35 ? 4 : 5;
    else if (pos === "WR") tier = posRank <= 10 ? 1 : posRank <= 20 ? 2 : posRank <= 32 ? 3 : posRank <= 43 ? 4 : 5;
    else if (pos === "TE") tier = posRank === 1 ? 1 : posRank <= 4 ? 2 : posRank <= 7 ? 3 : 4;
    else if (pos === "QB") tier = posRank <= 2 ? 1 : 2;
    else tier = 1;
    return [rank, name, pos, tier];
  });
}
const RANKINGS_TIERED = assignTiers(RANKINGS);

// ---------- State ----------
const state = {
  draftedNames: new Set(), // normalized-name keys, see normalizeName()
  draftId: "", // filled from the ?draft= URL param on load, see initFromUrlParams; no hardcoded fallback

  errorMsg: "",
  lastPickCount: 0,
  manualInput: "",
  currentRound: 1,

  teams: 12,
  rounds: 15,
  draftStatus: null, // pre_draft | drafting | complete
  pollHandle: null,
  usernameInput: "",
  slotLookupMsg: "",
  lastFetchedAt: null, // Date.now() of the last successful poll, for the staleness indicator
  detailsOpen: false, // default view is the plain-English recommendation card only; rankings/tiers/alerts are opt-in
  yourRoster: [], // {name, pos} the user has actually drafted, from live sync
  pickHistory: [], // ordered {pickNo, name, pos} for all picks, for run detection
  alerts: [], // {id, type: "tier-break"|"run"|"roster", text, pickNo}, newest first
  _slotToRosterId: null,
  _lastRunAlertKey: null,
  injuryData: new Map(), // normalizedName -> {status, startDate, practice}; only players with a real injury_status, from Sleeper's player DB (see fetchInjuryData)
  injuryFetchStatus: "idle", // idle | loading | ok | error
  injuryFetchedAt: null, // Date.now() of the last successful injury sync
};

function pickNoForRound(round, slot, teams) {
  const forward = (round % 2 === 1);
  const posInRound = forward ? slot : (teams - slot + 1);
  return (round - 1) * teams + posInRound;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Sleeper's metadata.last_name for suffixed players often drops the suffix
// (e.g. "Cook" not "Cook III"), so raw-string matching against RANKINGS
// ("James Cook III") silently fails. Compare on a normalized key instead.
function normalizeName(name) {
  return name
    .toLowerCase()
    .replace(/\b(jr|sr|ii|iii|iv|v)\.?\b/g, "")
    .replace(/[.']/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

// Injury designations severe enough to functionally rule a player out —
// hard-excluded from getRecommendations() below, the same way "avoid"/
// "pass" flags are, since headlining someone reported Out to a user with
// no football context to catch it is worse than a stale guide note.
// "Questionable" stays recommendable but gets a caution appended.
const SEVERE_INJURY_STATUSES = new Set(["Out", "Doubtful", "IR", "PUP", "NA", "Suspended"]);

function getInjury(name) {
  return state.injuryData.get(normalizeName(name)) || null;
}

function pushAlert(type, text) {
  state.alerts.unshift({id: Date.now() + Math.random(), type, text, pickNo: state.lastPickCount});
  state.alerts = state.alerts.slice(0, 10);
}

function detectTierBreaks(previousDrafted, currentDrafted) {
  const newlyDrafted = [...currentDrafted].filter(k => !previousDrafted.has(k));
  // Multiple picks can land in one poll (or on first connect to a draft
  // already in progress). Every player in a tier that just emptied would
  // independently satisfy "remainingInTier === 0" against the final state,
  // so dedupe to one alert per (pos, tier) — keeping the chronologically
  // last pick, since newlyDrafted iterates in pick order.
  const brokenTiers = new Map();
  newlyDrafted.forEach(key => {
    const entry = RANKINGS_TIERED.find(([, n]) => normalizeName(n) === key);
    if (!entry) return;
    const [, name, pos, tier] = entry;
    const remainingInTier = RANKINGS_TIERED.filter(([, n, p, t]) =>
      p === pos && t === tier && !currentDrafted.has(normalizeName(n))
    );
    if (remainingInTier.length === 0) {
      brokenTiers.set(`${pos}-${tier}`, {name, pos, tier});
    }
  });
  brokenTiers.forEach(({name, pos, tier}) => {
    const nextTier = RANKINGS_TIERED.filter(([, n, p, t]) =>
      p === pos && t === tier + 1 && !currentDrafted.has(normalizeName(n))
    ).slice(0, 3);
    const nextNames = nextTier.map(([, n]) => n).join(", ") || "none ranked";
    pushAlert("tier-break", `Last ${pos} in tier ${tier} is gone (${name}). Next tier: ${nextNames}.`);
  });
}

function detectRuns() {
  const recent = state.pickHistory.slice(-6);
  if (recent.length < 6) return;
  const counts = {};
  recent.forEach(p => { counts[p.pos] = (counts[p.pos] || 0) + 1; });
  const [runPos, runCount] = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  if (runCount >= 3) {
    const alertKey = `run-${runPos}-${state.lastPickCount}`;
    if (state._lastRunAlertKey === alertKey) return;
    state._lastRunAlertKey = alertKey;
    const tierLeft = RANKINGS_TIERED.filter(([, n, p]) => p === runPos && !state.draftedNames.has(normalizeName(n))).length;
    pushAlert("run", `Run on ${runPos} — ${runCount} of last 6 picks. ${tierLeft} ${runPos}s left ranked.`);
  }
}

function checkRosterWarnings() {
  const warnings = [];
  const highRiskCount = state.yourRoster.filter(p => {
    const f = getFlag(p.name);
    return f && typeof f.risk === "number" && f.risk >= 8;
  }).length;
  if (highRiskCount >= 3) {
    warnings.push(`You have ${highRiskCount} high-risk (8+/10) players rostered — consider balancing with a safer pick.`);
  }
  const posCounts = {};
  state.yourRoster.forEach(p => { posCounts[p.pos] = (posCounts[p.pos] || 0) + 1; });
  if (state.currentRound >= 8 && !posCounts["QB"]) {
    warnings.push("No QB rostered yet and it's Round 8+ — main target window (QB7-11 ADP) is closing.");
  }
  if (state.currentRound >= 10 && !posCounts["TE"]) {
    warnings.push("No TE rostered yet and it's Round 10+ — check the value tier before it's gone.");
  }
  if (posCounts["TE"] >= 2) {
    warnings.push(`You've drafted ${posCounts["TE"]} TEs — with only 1 starting TE spot, that bench value might've gone further at RB/WR.`);
  }
  if (posCounts["QB"] >= 3) {
    warnings.push(`You've drafted ${posCounts["QB"]} QBs — a 3rd rarely sees the field; that pick might be better used on RB/WR depth.`);
  }
  return warnings;
}

// ---------- Data fetching ----------
async function fetchDraftMeta(id) {
  try {
    const res = await fetch(`https://api.sleeper.app/v1/draft/${id}`);
    if (!res.ok) return;
    const meta = await res.json();
    if (meta && meta.settings) {
      if (meta.settings.teams) state.teams = meta.settings.teams;
      if (meta.settings.rounds) state.rounds = meta.settings.rounds;
    }
    if (meta && meta.status) state.draftStatus = meta.status;
    state._draftOrder = meta.draft_order || null;
    state._slotToRosterId = meta.slot_to_roster_id || null;
  } catch (e) { /* non-fatal, keep manual values */ }
}

async function fetchPicks(id) {
  try {
    state.liveStatus = "connecting";
    render();
    await fetchDraftMeta(id);
    const res = await fetch(`https://api.sleeper.app/v1/draft/${id}/picks`);
    if (!res.ok) throw new Error("Draft not found or not accessible");
    const picks = await res.json();

    const previousDrafted = state.draftedNames;
    const names = new Set();
    const pickHistory = [];
    const yourRosterId = state._slotToRosterId ? state._slotToRosterId[String(state.yourSlot)] : null;
    const yourRoster = [];

    picks.forEach(p => {
      const meta = p.metadata;
      if (!meta || !meta.first_name || !meta.last_name) return; // autopicked/on-the-clock picks can lack metadata
      const full = `${meta.first_name} ${meta.last_name}`.trim();
      const key = normalizeName(full);
      names.add(key);
      const pos = meta.position || (RANKINGS_TIERED.find(([, n]) => normalizeName(n) === key) || [])[2];
      pickHistory.push({pickNo: p.pick_no, name: full, pos});
      if (yourRosterId != null && p.roster_id === yourRosterId) {
        yourRoster.push({name: full, pos});
      }
      const inRankings = RANKINGS.some(([, n]) => normalizeName(n) === key);
      if (!inRankings && meta.position !== "DEF" && meta.position !== "K") {
        console.warn("Drafted player not in RANKINGS (may be past rank 150):", full);
      }
    });

    state.draftedNames = names;
    state.pickHistory = pickHistory;
    state.yourRoster = yourRoster;
    state.lastPickCount = picks.length;
    const nextPickNo = picks.length + 1;
    const inferredRound = Math.ceil(nextPickNo / state.teams);
    state.currentRound = Math.max(1, Math.min(state.rounds, inferredRound));
    state.liveStatus = "live";
    state.errorMsg = "";
    state.lastFetchedAt = Date.now();

    detectTierBreaks(previousDrafted, names);
    detectRuns();
  } catch (e) {
    state.liveStatus = "error";
    state.errorMsg = (e && e.message) || "Could not reach Sleeper API";
  }
  render();
}

// Sleeper's player database (distinct from the draft-specific endpoints
// above) carries real injury designations — injury_status/injury_start_date/
// practice_participation — sourced from the same feed Sleeper's own app
// uses, not from the static guide. Sleeper asks callers to hit this at
// most once a day (it's a multi-MB dump of every player), so this only
// runs once per connect or on manual refresh — never on the 8s pick-poll
// loop. Only players with a real injury_status are kept in memory;
// everyone else is dropped immediately.
async function fetchInjuryData() {
  state.injuryFetchStatus = "loading";
  render();
  try {
    const res = await fetch("https://api.sleeper.app/v1/players/nfl?active=true");
    if (!res.ok) throw new Error("unavailable");
    const players = await res.json();
    const injuries = new Map();
    Object.values(players).forEach(p => {
      if (!p || !p.injury_status || !p.full_name) return;
      injuries.set(normalizeName(p.full_name), {
        status: p.injury_status,
        startDate: p.injury_start_date || null,
        practice: p.practice_participation || null,
      });
    });
    state.injuryData = injuries;
    state.injuryFetchStatus = "ok";
    state.injuryFetchedAt = Date.now();
  } catch (e) {
    // Non-fatal — the app is fully usable on the static guide notes alone,
    // same as if this fetch had never been added.
    state.injuryFetchStatus = "error";
  }
  render();
}

// Sleeper's public API sits behind a CDN edge cache whose s-maxage for a
// live draft's /picks response is 30s (confirmed via response headers) —
// well above this 8s interval. Polling faster than that doesn't get
// fresher data, it just re-fetches the same cached snapshot more often,
// so a real pick can take up to ~30s to become visible no matter what.
// That's a server-side cache TTL, not something a client poll interval
// can fix — the mitigation is surfacing the staleness (see the "updated
// Xs ago" indicator) and keeping "Refresh now" / manual entry available
// for right-before-your-turn checks, not shortening this number.
const POLL_INTERVAL_MS = 8000;

// Player rankings/FLAGS below are a static snapshot, not a live feed —
// bump this string by hand whenever RANKINGS/FLAGS is re-checked against
// real news/ADP (see PLAYER_DATA_FRESHNESS_*.md for the process). Shown
// in the footer so the app never silently implies its data is current.
const PLAYER_DATA_LAST_VERIFIED = "Aug 25, 2026";

function startPolling(id) {
  clearInterval(state.pollHandle);
  state.pollHandle = setInterval(() => {
    if (state.liveStatus === "live" || state.liveStatus === "error") fetchPicks(id);
  }, POLL_INTERVAL_MS);
}

function connect() {
  const id = extractDraftId(state.draftId.trim());
  if (!id) return;
  state.draftId = id;
  fetchPicks(id);
  startPolling(id);
  if (state.injuryFetchStatus === "idle") fetchInjuryData();
}

// Reads ?draft=<id or url>&user=<sleeper_username> from the page's own
// URL so a shared link can auto-configure itself per recipient, instead
// of shipping with a hardcoded draft_id and slot=12 that only ever made
// sense for one person's dev testing. No params -> stays a blank,
// manual-entry-ready session; nothing auto-connects.
async function initFromUrlParams() {
  const params = new URLSearchParams(window.location.search);
  const draftParam = params.get("draft");
  if (!draftParam) return;
  const id = extractDraftId(draftParam.trim());
  if (!id) return;
  state.draftId = id;
  await fetchPicks(id);
  startPolling(id);
  if (state.injuryFetchStatus === "idle") fetchInjuryData();

  const userParam = params.get("user");
  if (userParam) {
    state.usernameInput = userParam.trim();
    await findMySlot();
  }
}

function extractDraftId(input) {
  if (!input) return "";
  const match = input.match(/draft\/nfl\/(\d+)/);
  if (match) return match[1];
  return input.replace(/[^\d]/g, "") ? input.trim() : input.trim();
}

function disconnect() {
  clearInterval(state.pollHandle);
  state.pollHandle = null;
  state.liveStatus = "idle";
  state.errorMsg = "";
  render();
}

function toggleManualPlayer(name) {
  const key = normalizeName(name);
  if (state.draftedNames.has(key)) state.draftedNames.delete(key);
  else state.draftedNames.add(key);
  render();
}

function addManual() {
  const trimmed = state.manualInput.trim();
  if (!trimmed) return;
  state.draftedNames.add(normalizeName(trimmed));
  state.manualInput = "";
  render();
}

function resetAll() {
  state.draftedNames = new Set();
  state.lastPickCount = 0;
  state.currentRound = 1;
  render();
}

async function findMySlot() {
  const username = state.usernameInput.trim();
  if (!username) return;
  state.slotLookupMsg = "Looking up...";
  render();
  try {
    const ures = await fetch(`https://api.sleeper.app/v1/user/${encodeURIComponent(username)}`);
    if (!ures.ok) throw new Error("User not found");
    const user = await ures.json();
    const order = state._draftOrder;
    if (!order || !(user.user_id in order)) {
      state.slotLookupMsg = `Couldn't find ${username} in this draft's order.`;
    } else {
      state.yourSlot = order[user.user_id];
      state.slotConfirmed = true;
      state.slotLookupMsg = `Found it — you're slot ${state.yourSlot}.`;
    }
  } catch (e) {
    state.slotLookupMsg = (e && e.message) || "Lookup failed";
  }
  render();
}

// pickNoForRound(currentRound, slot, teams) only gives the right answer
// while your turn *within that round* hasn't happened yet — once it has
// (you're waiting on the rest of the round to turn over), it points at a
// pick that already passed. Walk forward round-by-round instead.
function computeYourNextPickNo(nextOverallPickNo, slot, teams) {
  let round = Math.max(1, Math.ceil(nextOverallPickNo / teams));
  let candidate = pickNoForRound(round, slot, teams);
  while (candidate < nextOverallPickNo) {
    round += 1;
    candidate = pickNoForRound(round, slot, teams);
  }
  return candidate;
}

// Maps a round-plan's target position string to one of the position codes
// used throughout RANKINGS ("QB"/"RB"/"WR"/"TE"), or null when the plan is
// BPA / not tied to a single position (e.g. "Deep sleeper", "DST").
function getPlanPosition(planPos) {
  if (/QB/.test(planPos)) return "QB";
  if (/Handcuff/i.test(planPos)) return "RB";
  if (/RB/.test(planPos)) return "RB";
  if (/WR/.test(planPos)) return "WR";
  if (/TE/.test(planPos)) return "TE";
  return null;
}

// Diminishing marginal value: recommending more of a position than a
// realistic roster shape calls for competes for scarce picks against
// positions you might still be missing outright. TE has exactly one
// starting slot and thin bench value beyond it, so a 2nd one gets
// penalized starting immediately. QB isn't penalized until a 3rd — the
// round-by-round plan (see ROUND_PLAN, round 12) deliberately calls for
// exactly two QBs, a speculative rushing-upside QB2, so that shouldn't
// get fought by this. RB/WR soak up real bench/flex/handcuff value well
// past their own starter count, so they're barely penalized until well
// past a normal roster shape.
const POSITION_SATURATION = {
  QB: { softCap: 2, penaltyPerOver: 30 },
  TE: { softCap: 1, penaltyPerOver: 22 },
  RB: { softCap: 5, penaltyPerOver: 8 },
  WR: { softCap: 5, penaltyPerOver: 8 },
};

function saturationPenalty(pos, posCounts) {
  const rule = POSITION_SATURATION[pos];
  if (!rule) return 0;
  const have = posCounts[pos] || 0;
  const over = have - rule.softCap + 1;
  return over > 0 ? over * rule.penaltyPerOver : 0;
}

// Synthesizes tier state + run/flag data + the round-by-round plan +
// roster need into a ranked shortlist — the actual "what should I do
// right now" answer, not just the raw ingredients for one.
function getRecommendations(available, plan, yourRoster) {
  const posCounts = {};
  yourRoster.forEach(p => { if (p.pos) posCounts[p.pos] = (posCounts[p.pos] || 0) + 1; });
  const planPos = getPlanPosition(plan.pos);

  // "avoid"/"pass" are categorical guide calls ("don't take this"), not a
  // mild preference — hard-exclude from the recommendation shortlist
  // rather than just docking points, so a rank-heavy avoid/pass can't
  // still win the #1 slot. They still show in "Best available" with their
  // ⚠️/🎯 icons; this pool is only for what gets actively recommended.
  const candidatePool = available.filter(([, name]) => {
    const tag = FLAGS[name] && FLAGS[name].tag;
    if (tag === "avoid" || tag === "pass") return false;
    const injury = getInjury(name);
    if (injury && SEVERE_INJURY_STATUSES.has(injury.status)) return false;
    return true;
  });

  const scored = candidatePool.slice(0, 40).map(([rank, name, pos, tier]) => {
    let score = 200 - rank;
    const reasons = []; // technical, for the "Show details" view
    let headline = null; // one plain-English sentence for the default view, no tier/BPA/PPG jargon

    const flag = FLAGS[name];
    if (flag && flag.tag === "target") {
      score += 10;
      if (flag.note) {
        reasons.push(`Target: ${flag.note}`);
        headline = flag.note;
      } else {
        // No note behind this tag — don't let the generic filler line beat
        // out a genuinely specific reason from the checks below; it only
        // gets used as a last resort (see the fallback near the bottom).
        reasons.push("Flagged target");
      }
    }

    // Scarcity is about the whole board, not just the recommendable pool —
    // count against `available`, not `candidatePool`. Checked before the
    // round-plan note below: this is genuinely unique to whichever single
    // player is last in their tier, where a round-plan note is the same
    // canned line for every candidate at that position — the more
    // specific, player-true reason should win the headline first.
    const tierMatesLeft = available.filter(([, n, p, t]) => p === pos && t === tier).length;
    if (tierMatesLeft === 1) {
      score += 8;
      reasons.push(`Last ${pos} in tier ${tier} — next tier is a real drop-off`);
      if (!headline) headline = `Last good ${pos} before the next tier drops off`;
    }

    if (planPos && pos === planPos) {
      // The plan calls for this position in this round — but if the
      // roster already satisfies however many rounds' worth of this
      // position the plan has called for UP TO this round, that need is
      // already met and this shouldn't fire again just because the round
      // number matches. This is what let round 8 tell you to draft a 2nd
      // QB (Trevor Lawrence) one round after you'd already taken a QB
      // (Caleb Williams) off the board on your own — the plan doesn't
      // know your actual roster, it just always says "QB" at round 8.
      // Comparing against how many QB/TE/etc rounds the plan has passed
      // through (not a flat cap) is what lets round 12's deliberate QB2
      // upside slot still fire correctly even though round 8 already
      // filled QB1.
      const plannedSoFar = ROUND_PLAN.filter(p => p.r <= plan.r && getPlanPosition(p.pos) === planPos).length;
      const already = posCounts[planPos] || 0;
      if (already < plannedSoFar) {
        score += 15;
        reasons.push(`Round ${plan.r} plan calls for ${planPos}`);
        // The round plan's own note is real strategic reasoning (e.g. round
        // 1's is literally an argument against chasing "value"), so it's a
        // better fallback than a canned filler line — but it's still a
        // ROUND-level note, identical for every candidate at that position,
        // not proof this specific player is the one to take. Only plan notes
        // that don't name specific other players belong here (see ROUND_PLAN
        // above — round 5/10 notes were rewritten for exactly this reason
        // after two different WRs both got shown a note naming four
        // completely different receivers).
        if (!headline) headline = plan.note || `Round ${plan.r} calls for ${planPos} here`;
      } else {
        reasons.push(`Round ${plan.r} plan called for ${planPos}, but you already have ${already} rostered — that need looks filled`);
      }
    }

    if (pos === "QB" && state.currentRound >= 6 && !posCounts.QB) {
      score += 6;
      reasons.push("No QB rostered yet");
      if (!headline) headline = "You don't have a QB yet";
    }
    if (pos === "TE" && state.currentRound >= 8 && !posCounts.TE) {
      score += 6;
      reasons.push("No TE rostered yet");
      if (!headline) headline = "You don't have a TE yet";
    }

    if (!headline && flag && flag.tag === "target") headline = "One of the guide's flagged targets this year";
    if (!headline) headline = "Best player left on the board";

    const satPenalty = saturationPenalty(pos, posCounts);
    if (satPenalty > 0) {
      score -= satPenalty;
      const have = posCounts[pos];
      reasons.push(`Already have ${have} ${pos}${have === 1 ? "" : "s"} rostered — likely more value elsewhere right now`);
      headline = `${headline} — you already have ${have} ${pos}${have === 1 ? "" : "s"}, worth weighing against other needs first`;
    }

    const injury = getInjury(name);
    if (injury && injury.status === "Questionable") {
      reasons.push(`Injury watch: Questionable${injury.practice ? ` (practice: ${injury.practice})` : ""}`);
      headline = `${headline} — currently Questionable, worth a last check before your pick`;
    }

    return {rank, name, pos, tier, score, reasons, headline};
  });

  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, 5);
}

// ---------- Render ----------
function render() {
  const available = RANKINGS_TIERED.filter(([, name]) => !state.draftedNames.has(normalizeName(name)));
  const topAvailable = available.slice(0, 15);
  const plan = ROUND_PLAN.find(p => p.r === state.currentRound) || ROUND_PLAN[ROUND_PLAN.length - 1];
  const yourNextPickNo = computeYourNextPickNo(state.lastPickCount + 1, state.yourSlot, state.teams);
  const picksUntilYourTurn = yourNextPickNo - (state.lastPickCount + 1);
  const isYourTurn = state.liveStatus === "live" && picksUntilYourTurn <= 0;
  const recommendations = getRecommendations(available, plan, state.yourRoster);

  const targetsStillUp = available.filter(([, name]) => FLAGS[name] && FLAGS[name].tag === "target").slice(0, 8);
  const avoidStillUp = available.filter(([, name]) => FLAGS[name] && FLAGS[name].tag === "avoid").slice(0, 5);

  const posBadge = pos => `<span class="pos-badge pos-${pos}">${pos}</span>`;

  const injuryStatusText = state.injuryFetchStatus === "loading" ? "syncing…"
    : state.injuryFetchStatus === "error" ? "unavailable right now — using guide notes only"
    : state.injuryFetchedAt ? `synced ${Math.max(0, Math.round((Date.now() - state.injuryFetchedAt) / 60000))}m ago via Sleeper`
    : "not synced yet";

  const connectionPanel = state.liveStatus !== "live" ? `
    <div class="row">
      <input id="draftIdInput" type="text" class="grow" placeholder="Paste Sleeper draft URL or draft_id" value="${escapeHtml(state.draftId)}" />
      <button id="connectBtn">${state.liveStatus === "connecting" ? "Connecting…" : "Connect"}</button>
    </div>
  ` : `
    <div class="row wrap">
      <span class="row" style="gap:6px; font-size:13px; color: var(--text-success);">
        <span class="dot"></span>
        Live &middot; ${state.lastPickCount} picks made${state.draftStatus ? " &middot; " + escapeHtml(state.draftStatus.replace("_"," ")) : ""}
      </span>
      <span id="staleness-indicator" style="font-size:12px; color: var(--text-muted);">updated just now</span>
      <button id="refreshBtn" class="secondary">Refresh now</button>
      <button id="disconnectBtn" class="secondary">Disconnect</button>
    </div>
  `;

  const errorBlock = state.liveStatus === "error"
    ? `<p class="error-text">${escapeHtml(state.errorMsg)}. Check the draft_id, or use manual mode below instead.</p>`
    : "";

  const targetsHtml = targetsStillUp.length > 0 ? `
    <div style="margin-bottom:12px;">
      <div class="label" style="color: var(--text-success); text-transform:none; font-weight:600;">🎯 Flagged targets still available</div>
      <div class="row wrap">
        ${targetsStillUp.map(([, name, pos]) => `
          <span class="chip target" title="${escapeHtml((FLAGS[name] && FLAGS[name].note) || "")}">${escapeHtml(name)} <span style="opacity:0.7;">(${pos})</span></span>
        `).join("")}
      </div>
    </div>
  ` : "";

  const avoidHtml = avoidStillUp.length > 0 ? `
    <div style="margin-bottom:12px;">
      <div class="label" style="color: var(--text-danger); text-transform:none; font-weight:600;">⚠️ Flagged fades still available</div>
      <div class="row wrap">
        ${avoidStillUp.map(([, name, pos]) => `
          <span class="chip avoid" title="${escapeHtml((FLAGS[name] && FLAGS[name].note) || "")}">${escapeHtml(name)} <span style="opacity:0.7;">(${pos})</span></span>
        `).join("")}
      </div>
    </div>
  ` : "";

  // Live from Sleeper's player data (fetchInjuryData), not the static guide
  // — anyone currently carrying a real injury designation who's still on
  // the board, so it's visible *why* a highly-ranked name isn't showing up
  // as a recommendation instead of it just silently vanishing.
  const injuredStillUp = available.filter(([, name]) => getInjury(name)).slice(0, 8);
  const injuryHtml = injuredStillUp.length > 0 ? `
    <div>
      <div class="label" style="color: var(--text-warning); text-transform:none; font-weight:600;">🚑 Injury watch (still on the board)</div>
      <div class="row wrap">
        ${injuredStillUp.map(([, name, pos]) => {
          const inj = getInjury(name);
          return `<span class="chip" style="background:var(--bg-warning); color:var(--text-warning);" title="${escapeHtml(inj.practice ? "Practice: " + inj.practice : "")}">${escapeHtml(name)} — ${escapeHtml(inj.status)} <span style="opacity:0.7;">(${pos})</span></span>`;
        }).join("")}
      </div>
    </div>
  ` : "";

  // Default view: one plain-English sentence, no tier numbers / "BPA" /
  // PPG-gap stats. The full technical reasoning still exists (in each
  // recommendation's `.reasons`) and surfaces in the "Show details" chip
  // tooltips, but the headline card never shows raw jargon.
  const recommendationHtml = recommendations.length === 0 ? '<p class="muted-note">No recommendation yet — connect live sync or add manual picks.</p>'
    : isYourTurn ? `
      <div class="row" style="align-items:flex-start; gap:14px;">
        ${posBadge(recommendations[0].pos)}
        <div class="grow">
          <div style="font-size:19px; font-weight:600;">Pick ${escapeHtml(recommendations[0].name)}</div>
          <p style="margin:6px 0 0; font-size:14px; color: var(--text-secondary);">${escapeHtml(recommendations[0].headline)}</p>
        </div>
        <button class="secondary" data-drafted-name="${escapeHtml(recommendations[0].name)}">Already drafted<br>(fix tracking)</button>
      </div>
    ` : `
      <p style="margin:0 0 10px; font-size:13px; color: var(--text-secondary); text-transform:uppercase; letter-spacing:0.02em; font-weight:600;">Worth watching</p>
      <div style="display:flex; flex-direction:column; gap:10px;">
        ${recommendations.slice(0, 2).map(r => `
          <div class="row" style="align-items:flex-start; gap:10px;">
            ${posBadge(r.pos)}
            <div class="grow">
              <div style="font-size:15px; font-weight:600;">${escapeHtml(r.name)}</div>
              <div style="font-size:13px; color: var(--text-secondary);">${escapeHtml(r.headline)}</div>
            </div>
          </div>
        `).join("")}
      </div>
    `;

  const bestAvailableHtml = topAvailable.map(([rank, name, pos, tier]) => {
    const flag = FLAGS[name];
    let icon = "";
    if (flag && flag.tag === "target") icon = `<span class="flag-icon" title="${flag.note ? "Target: " + escapeHtml(flag.note) : "Flagged target"}">🎯</span>`;
    if (flag && flag.tag === "avoid") icon = `<span class="flag-icon" title="${flag.note ? "Avoid: " + escapeHtml(flag.note) : "Flagged avoid"}">⚠️</span>`;
    const rowInjury = getInjury(name);
    const injuryIcon = rowInjury
      ? `<span class="flag-icon" title="${escapeHtml(rowInjury.status)}${rowInjury.practice ? " — practice: " + escapeHtml(rowInjury.practice) : ""}">🚑 ${escapeHtml(rowInjury.status)}</span>`
      : "";
    return `
      <div class="player-row">
        <span class="rank">${rank}</span>
        ${posBadge(pos)}
        <span class="player-name">${escapeHtml(name)}</span>
        <span class="pill" style="font-weight:500;" title="Tier ${tier} at ${pos}">T${tier}</span>
        ${icon}
        ${injuryIcon}
        <button class="secondary" data-drafted-name="${escapeHtml(name)}" title="This only fixes this app's tracking — it does not submit a real pick in Sleeper">Already drafted</button>
      </div>
    `;
  }).join("");

  const alertsHtml = state.alerts.length === 0
    ? '<p class="muted-note">No alerts yet.</p>'
    : state.alerts.map(a => {
        const colors = a.type === "tier-break"
          ? {bg: "var(--bg-warning)", text: "var(--text-warning)"}
          : a.type === "run"
            ? {bg: "var(--bg-danger)", text: "var(--text-danger)"}
            : {bg: "var(--bg-accent)", text: "var(--text-accent)"};
        return `
          <div class="card-flat" style="margin-bottom:6px; padding:10px 12px;">
            <span class="pill" style="background:${colors.bg}; color:${colors.text}; margin-right:8px;">${a.type}</span>
            <span style="font-size:13px;">${escapeHtml(a.text)}</span>
          </div>
        `;
      }).join("");

  const rosterWarnings = checkRosterWarnings();
  const rosterHtml = state.yourRoster.length === 0
    ? '<p class="muted-note">No picks yet.</p>'
    : `<div class="row wrap">${state.yourRoster.map(p => `<span class="chip" style="background:var(--surface-2);">${posBadge(p.pos || "?")} ${escapeHtml(p.name)}</span>`).join("")}</div>`;

  document.getElementById("app").innerHTML = `
    <h1>Bozo Club Draft Assistant</h1>
    <p class="subtitle">Pick ${state.yourSlot} of ${state.teams} &middot; ${state.teams}-team PPR &middot; snake draft</p>
    <p style="font-size:12.5px; color: var(--text-muted); margin:-6px 0 1.25rem; padding:8px 10px; background: var(--surface-2); border-radius: 8px;">
      ⚠️ This app only tells you who to pick — make your actual pick in the Sleeper app or site.
    </p>

    <div class="card">
      <div class="label">Sleeper live sync</div>
      ${connectionPanel}
      ${errorBlock}
      <p class="muted-note">Paste the full draft URL or just the draft_id. Auto-refreshes every 8s while live — Sleeper's own API can still lag ~30s behind the draft room (their public endpoint is CDN-cached), so use "Refresh now" or manual entry right before your pick.</p>
      <p class="muted-note">
        🚑 Injury data: ${injuryStatusText}
        <button id="refreshInjuryBtn" class="secondary" style="margin-left:6px; padding:2px 8px; font-size:11px;">Refresh</button>
      </p>
    </div>

    <div class="card">
      <div class="label">Your draft settings</div>
      ${!state.slotConfirmed ? `<p class="error-text" style="margin:0 0 10px;">⚠️ Using default slot ${state.yourSlot} — unconfirmed. Enter your Sleeper username below and hit Find (or edit "Your slot" yourself) before trusting any "picks until your turn" timing.</p>` : ""}
      <div class="row wrap" style="gap:16px;">
        <div class="field-inline">
          <label for="slotInput">Your slot</label>
          <input id="slotInput" type="number" min="1" max="${state.teams}" value="${state.yourSlot}" />
        </div>
        <div class="field-inline">
          <label for="teamsInput">Teams</label>
          <input id="teamsInput" type="number" min="2" max="20" value="${state.teams}" />
        </div>
        <div class="row grow" style="min-width:220px;">
          <input id="usernameInput" type="text" placeholder="Sleeper username (auto-find slot)" class="grow" value="${escapeHtml(state.usernameInput)}" />
          <button id="findSlotBtn" class="secondary">Find</button>
        </div>
      </div>
      ${state.slotLookupMsg ? `<p class="status-text">${escapeHtml(state.slotLookupMsg)}</p>` : ""}
    </div>

    <div class="stat-grid">
      <div class="stat"><div class="label">Round</div><div class="value">${state.currentRound}</div></div>
      <div class="stat"><div class="label">Your next pick</div><div class="value">#${yourNextPickNo}</div></div>
      <div class="stat"><div class="label">Drafted so far</div><div class="value">${state.draftedNames.size}</div></div>
    </div>

    <div class="card" style="border-color: var(--accent);">
      <div class="row" style="margin-bottom:10px;">
        <span style="font-size:15px; font-weight:600;">${isYourTurn ? "🎯 It's your turn" : `⏳ Not your turn yet — ${picksUntilYourTurn} pick${picksUntilYourTurn === 1 ? "" : "s"} away`}</span>
      </div>
      ${recommendationHtml}
    </div>

    <button id="toggleDetailsBtn" class="secondary" style="width:100%; margin-bottom:1.25rem;">
      ${state.detailsOpen ? "▴ Hide details" : "▾ Show details (full rankings, tiers, alerts, roster plan)"}
    </button>

    ${state.detailsOpen ? `
    <div class="card-flat">
      <div class="row" style="margin-bottom:6px;">
        <span class="pill">Round ${plan.r} plan</span>
        <span style="font-size:15px; font-weight:600;">${escapeHtml(plan.pos)}</span>
      </div>
      ${plan.note ? `<p style="font-size:14px; color: var(--text-secondary); margin:0;">${escapeHtml(plan.note)}</p>` : ""}
    </div>

    ${(targetsStillUp.length > 0 || avoidStillUp.length > 0 || injuredStillUp.length > 0) ? `<div style="margin-bottom:1.25rem;">${targetsHtml}${avoidHtml}${injuryHtml}</div>` : ""}

    <div style="margin-bottom:1.25rem;">
      <h2>Best available</h2>
      <div id="best-available-list">${bestAvailableHtml}</div>
    </div>

    <div style="margin-bottom:1.25rem;">
      <h2>Draft alerts</h2>
      <div id="alerts-list">${alertsHtml}</div>
    </div>

    <div style="margin-bottom:1.25rem;">
      <h2>Your roster</h2>
      <div id="roster-list">${rosterHtml}</div>
      ${rosterWarnings.map(w => `<p class="error-text" style="margin-top:6px;">${escapeHtml(w)}</p>`).join("")}
    </div>

    <div class="card">
      <div class="label">Manual entry (if live sync isn't available)</div>
      <div class="row" style="margin-bottom:8px;">
        <input id="manualInput" type="text" class="grow" placeholder="Player name drafted by anyone" value="${escapeHtml(state.manualInput)}" />
        <button id="addManualBtn">Add</button>
      </div>
      <div class="row">
        <label class="field-inline" style="gap:6px;">Round:
          <input id="roundInput" type="number" min="1" max="${state.rounds}" value="${state.currentRound}" />
        </label>
        <button id="resetBtn" class="danger-ghost" style="margin-left:auto;">Reset draft</button>
      </div>
    </div>
    ` : ""}

    <p style="font-size:11px; color: var(--text-muted); text-align:center; margin:1.5rem 0 0.5rem;">
      Player rankings/notes last verified against real news &amp; ADP: ${PLAYER_DATA_LAST_VERIFIED}. Not a live feed — sanity-check anything time-sensitive (injuries, depth charts) before your pick.
    </p>
  `;

  wireEvents();
}

function wireEvents() {
  const byId = id => document.getElementById(id);

  const draftIdInput = byId("draftIdInput");
  if (draftIdInput) draftIdInput.addEventListener("input", e => { state.draftId = e.target.value; });
  const connectBtn = byId("connectBtn");
  if (connectBtn) connectBtn.addEventListener("click", connect);
  if (draftIdInput) draftIdInput.addEventListener("keydown", e => { if (e.key === "Enter") connect(); });

  const refreshBtn = byId("refreshBtn");
  if (refreshBtn) refreshBtn.addEventListener("click", () => fetchPicks(state.draftId));
  const refreshInjuryBtn = byId("refreshInjuryBtn");
  if (refreshInjuryBtn) refreshInjuryBtn.addEventListener("click", fetchInjuryData);
  const disconnectBtn = byId("disconnectBtn");
  if (disconnectBtn) disconnectBtn.addEventListener("click", disconnect);

  const slotInput = byId("slotInput");
  if (slotInput) slotInput.addEventListener("change", e => {
    state.yourSlot = Math.max(1, Math.min(state.teams, Number(e.target.value) || 1));
    state.slotConfirmed = true; // an explicit manual edit counts as the user confirming it themselves
    render();
  });
  const teamsInput = byId("teamsInput");
  if (teamsInput) teamsInput.addEventListener("change", e => {
    state.teams = Math.max(2, Math.min(20, Number(e.target.value) || 12));
    render();
  });
  const usernameInput = byId("usernameInput");
  if (usernameInput) usernameInput.addEventListener("input", e => { state.usernameInput = e.target.value; });
  const findSlotBtn = byId("findSlotBtn");
  if (findSlotBtn) findSlotBtn.addEventListener("click", findMySlot);

  const toggleDetailsBtn = byId("toggleDetailsBtn");
  if (toggleDetailsBtn) toggleDetailsBtn.addEventListener("click", () => {
    state.detailsOpen = !state.detailsOpen;
    render();
  });

  document.querySelectorAll("[data-drafted-name]").forEach(btn => {
    btn.addEventListener("click", () => toggleManualPlayer(btn.getAttribute("data-drafted-name")));
  });

  const manualInput = byId("manualInput");
  if (manualInput) {
    manualInput.addEventListener("input", e => { state.manualInput = e.target.value; });
    manualInput.addEventListener("keydown", e => { if (e.key === "Enter") addManual(); });
  }
  const addManualBtn = byId("addManualBtn");
  if (addManualBtn) addManualBtn.addEventListener("click", addManual);

  const roundInput = byId("roundInput");
  if (roundInput) roundInput.addEventListener("change", e => {
    state.currentRound = Math.min(state.rounds, Math.max(1, Number(e.target.value) || 1));
    render();
  });

  const resetBtn = byId("resetBtn");
  if (resetBtn) resetBtn.addEventListener("click", resetAll);
}

render();
// No baked-in draft/slot for a shared link — only auto-connects when the
// URL itself carries ?draft=(&user=), e.g. a personalized link generated
// per teammate. Opening the bare page is a blank, manual-entry session.
initFromUrlParams();

// Lightweight ticker for the "updated Xs ago" staleness indicator — kept
// separate from render() so it doesn't blow away focus/typing in the
// draft_id or manual-entry inputs every second.
setInterval(() => {
  const el = document.getElementById("staleness-indicator");
  if (!el || !state.lastFetchedAt) return;
  const secs = Math.round((Date.now() - state.lastFetchedAt) / 1000);
  el.textContent = secs <= 1 ? "updated just now" : `updated ${secs}s ago`;
}, 1000);
</script>
</body>
</html>
